name: Build and Deploy Docker Image

# Bootstrap deployer. After this image is live, Garden merge CI can self-deploy
# via .boxci/pipeline.yml (deploy/self-deploy.sh). Keep this workflow for the
# first rollout and as an emergency path (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: boxci

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build Docker image
        run: |
          nix build .#dockerImage -L
          docker load < result
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Push image to Cloudflare registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest containers push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install worker dependencies
        working-directory: deploy/worker
        run: npm install

      - name: Deploy to Cloudflare
        working-directory: deploy/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOXCI_THINK_SECRET: ${{ secrets.BOXCI_THINK_SECRET }}
        run: |
          # Update wrangler.toml with the SHA-tagged image
          sed -i "s|image = .*|image = \"registry.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\"|" wrangler.toml
          npx wrangler@latest deploy
          # Worker secret is forwarded into the container for self-deploy.
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler@latest secret put CLOUDFLARE_API_TOKEN
          if [ -n "${BOXCI_THINK_SECRET:-}" ]; then
            printf '%s' "$BOXCI_THINK_SECRET" | npx wrangler@latest secret put BOXCI_THINK_SECRET
          fi
